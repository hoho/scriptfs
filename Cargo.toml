[package]
name = "scriptfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Programmable filesystem overlays with JavaScript modules"

[[bin]]
name = "scriptfs"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
regress = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { path = "vendor/fuser", default-features = false, features = ["abi-7-31"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
