name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Portable checks
        run: pnpm check

      - name: Install Linux integration prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman cifs-utils
          sudo modprobe fuse
          sudo modprobe cifs
          test -c /dev/fuse
          sudo podman info

      - name: Build fresh Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo podman build \
            --build-arg "NPM_REGISTRY=$(npm config get registry)" \
            --tag localhost/scriptfs-runtime:0.0.1 \
            --file container/Containerfile .

      - name: Linux FUSE and SMB integration
        if: runner.os == 'Linux'
        run: |
          sudo env "PATH=$PATH" "CI=true" \
            "NPM_CONFIG_USERCONFIG=$(npm config get userconfig)" \
            pnpm test:e2e
