name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same matrix before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        id: msys2
        with:
          msystem: UCRT64
          release: false
          install: make
      - name: Expose GNU Make
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '& "$env:MSYS2_LOCATION\usr\bin\make.exe" ci-expose-make'
      # Install before setup-node so its pnpm cache can locate the store.
      - name: Install pnpm
        run: make ci-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: make ci-install

      - name: Install Rust
        run: make ci-rust

      - name: Portable checks
        run: make check

      - name: Install Linux integration prerequisites
        if: runner.os == 'Linux'
        run: make ci-linux-setup

      - name: Linux FUSE and SMB integration
        if: runner.os == 'Linux'
        run: make ci-linux

      - name: Install Windows integration prerequisites
        if: runner.os == 'Windows'
        run: make ci-windows-setup

      - name: Build fresh Windows runtime
        if: runner.os == 'Windows'
        run: make runtime-check build-image

      - name: Windows FUSE and SMB integration
        if: runner.os == 'Windows'
        run: make test-e2e

      - name: Stop Windows Podman machine
        if: always() && runner.os == 'Windows'
        run: make stop-podman
